<mat-toolbar>
  <span>LOGIN</span>
</mat-toolbar>
<mat-card class="my-card">
  <mat-card-content>
    <form class="my-form" #formData="ngForm">
      <mat-form-field class="full-width">
        <mat-label>Username</mat-label>
        <input  ngModel matInput  placeholder="Username" name="username">
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Password</mat-label>
        <input  ngModel matInput  placeholder="Password" name="password">
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" [disabled]="formData.invalid" (click)="login(formData)">LOGIN</button>
  </mat-card-actions>
</mat-card>
